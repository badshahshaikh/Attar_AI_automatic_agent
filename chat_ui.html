<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MS Fragrances — AI Product Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    /* ── Reset & tokens ─────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-app:       #ece5dd;   /* WhatsApp wallpaper beige */
      --bg-header:    #128c7e;   /* WhatsApp header teal */
      --bg-input:     #f0f0f0;
      --bg-sent:      #dcf8c6;   /* customer bubble green */
      --bg-recv:      #ffffff;   /* AI bubble white */
      --bg-details:   #f7f7f7;
      --text-primary: #111;
      --text-meta:    #667781;
      --text-header:  #fff;
      --accent:       #128c7e;
      --accent-hover: #0e7568;
      --border:       #d9d9d9;
      --shadow:       0 1px 3px rgba(0,0,0,.12);
      --radius:       12px;
      --radius-sm:    8px;
      --font:         'Inter', system-ui, sans-serif;
    }

    html, body {
      height: 100%;
      font-family: var(--font);
      background: #202c33;   /* dark outer shell */
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── App shell ──────────────────────────────────────────────────── */
    #app {
      width: 100%;
      max-width: 960px;
      height: 100dvh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      background: var(--bg-app);
      border-radius: 0;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(0,0,0,.5);
    }

    /* ── Header ─────────────────────────────────────────────────────── */
    header {
      background: var(--bg-header);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .avatar {
      width: 42px; height: 42px;
      border-radius: 50%;
      background: #fff3;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    .header-info { flex: 1; min-width: 0; }
    .header-info h1 {
      font-size: 16px; font-weight: 600;
      color: var(--text-header);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .header-info p {
      font-size: 12px; color: rgba(255,255,255,.75);
      margin-top: 1px;
    }

    #btn-new-chat {
      background: rgba(255,255,255,.18);
      border: 1px solid rgba(255,255,255,.35);
      color: #fff;
      font-size: 12px; font-weight: 500;
      padding: 5px 12px;
      border-radius: 20px;
      cursor: pointer;
      white-space: nowrap;
      transition: background .15s;
    }
    #btn-new-chat:hover { background: rgba(255,255,255,.30); }

    #btn-clear-chat {
      background: rgba(255,255,255,.18);
      border: 1px solid rgba(255,255,255,.35);
      color: #fff;
      font-size: 12px; font-weight: 500;
      padding: 5px 12px;
      border-radius: 20px;
      cursor: pointer;
      white-space: nowrap;
      transition: background .15s;
    }
    #btn-clear-chat:hover { background: rgba(255,255,255,.30); }

    /* ── Config bar (backend URL) ───────────────────────────────────── */
    #config-bar {
      background: #fff;
      border-bottom: 1px solid var(--border);
      padding: 6px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    #config-bar label { font-size: 11px; color: var(--text-meta); white-space: nowrap; }
    #api-url-input {
      flex: 1;
      font-size: 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 8px;
      font-family: monospace;
      color: #333;
      background: #fafafa;
      outline: none;
    }
    #api-url-input:focus { border-color: var(--accent); }
    #btn-save-url {
      font-size: 11px; font-weight: 500;
      padding: 4px 10px;
      background: var(--accent); color: #fff;
      border: none; border-radius: 6px; cursor: pointer;
      transition: background .15s;
    }
    #btn-save-url:hover { background: var(--accent-hover); }

    /* ── Messages area ──────────────────────────────────────────────── */
    #messages {
      flex: 1;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      scroll-behavior: smooth;
    }

    /* ── Message row ─────────────────────────────────────────────────── */
    .msg-row {
      display: flex;
      flex-direction: column;
      max-width: 82%;
      animation: fadeUp .2s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg-row.sent  { align-self: flex-end; align-items: flex-end; }
    .msg-row.recv  { align-self: flex-start; align-items: flex-start; }

    .bubble {
      padding: 10px 14px;
      border-radius: var(--radius);
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
      overflow-wrap: anywhere;
      box-shadow: var(--shadow);
      position: relative;
    }
    .sent  .bubble { background: var(--bg-sent); border-bottom-right-radius: 4px; }
    .recv  .bubble { background: var(--bg-recv); border-bottom-left-radius: 4px; }

    .bubble .meta {
      display: block;
      font-size: 10px;
      color: var(--text-meta);
      text-align: right;
      margin-top: 4px;
    }

    /* ── Expandable details panel ────────────────────────────────────── */
    .details-wrap {
      margin-top: 4px;
      width: 100%;
    }

    details {
      background: var(--bg-details);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      overflow: hidden;
      font-size: 12px;
    }

    summary {
      padding: 6px 10px;
      cursor: pointer;
      font-weight: 500;
      color: var(--accent);
      user-select: none;
      list-style: none;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    summary::before {
      content: '▶';
      font-size: 9px;
      transition: transform .15s;
    }
    details[open] summary::before { transform: rotate(90deg); }

    .details-body {
      padding: 8px 10px 10px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .details-section h4 {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-meta);
      text-transform: uppercase;
      letter-spacing: .06em;
      margin-bottom: 4px;
    }

    /* Tool call pills */
    .tool-call {
      background: #e8f5e9;
      border: 1px solid #c8e6c9;
      border-radius: 6px;
      padding: 4px 8px;
      font-family: monospace;
      font-size: 11.5px;
      color: #2e7d32;
    }
    .tool-call span { color: #555; font-weight: 400; }

    /* Product result cards */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 8px;
    }
    .product-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 13px;
      box-shadow: var(--shadow);
    }
    .product-card .img-placeholder {
      width: 100%;
      height: 90px;
      background: linear-gradient(135deg,#f5efe6,#efe2d2);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 32px;
      color: #a98a6a;
    }
    .product-card .name { font-weight: 600; color: #111; font-size: 14px; }
    .product-card .price { font-weight: 600; color: #2e7d32; font-size: 15px; }
    .product-card .size { color: var(--text-meta); font-size: 12px; }
    .product-card .desc { color: #555; font-size: 12px; line-height: 1.4; }
    .product-card .stock-yes { color: #2e7d32; font-size: 12px; font-weight: 600; }
    .product-card .stock-no  { color: #c62828; font-size: 12px; font-weight: 600; }
    .product-card .reason {
      font-size: 11px; color: var(--accent); font-style: italic;
      border-left: 2px solid var(--accent); padding-left: 6px;
    }
    .badge {
      display: inline-block; font-size: 10px; font-weight: 600;
      padding: 2px 8px; border-radius: 10px; text-transform: uppercase; letter-spacing: .03em;
    }
    .badge.verified   { background: #e8f5e9; color: #2e7d32; }
    .badge.unverified { background: #fff3e0; color: #e65100; }
    .badge.out-of-stock { background: #ffebee; color: #c62828; }
    .badge.not-found  { background: #f3e5f5; color: #6a1b9a; }
    .product-card .actions { margin-top: 4px; display: flex; gap: 6px; }
    .product-card .actions button {
      flex: 1; font-size: 11px; font-weight: 500;
      padding: 6px 8px; border-radius: 8px; cursor: pointer;
      border: 1px solid var(--accent); background: #fff; color: var(--accent);
      transition: background .15s, color .15s;
    }
    .product-card .actions button:hover { background: var(--accent); color: #fff; }

    .no-results { color: var(--text-meta); font-style: italic; padding: 2px 0; }

    /* raw JSON fallback */
    .raw-json {
      background: #f9f9f9;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 8px;
      font-family: monospace;
      font-size: 11px;
      white-space: pre-wrap;
      word-break: break-all;
      color: #444;
    }

    /* ── Loading indicator ───────────────────────────────────────────── */
    .typing-row {
      align-self: flex-start;
      animation: fadeUp .2s ease;
    }
    .typing {
      background: var(--bg-recv);
      border-radius: var(--radius);
      border-bottom-left-radius: 4px;
      padding: 10px 14px;
      box-shadow: var(--shadow);
      display: flex; gap: 5px; align-items: center;
    }
    .typing span {
      width: 8px; height: 8px;
      background: #999;
      border-radius: 50%;
      display: inline-block;
      animation: bounce 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: .2s; }
    .typing span:nth-child(3) { animation-delay: .4s; }
    @keyframes bounce {
      0%,60%,100% { transform: translateY(0); }
      30%          { transform: translateY(-6px); }
    }

    /* ── Error toast ─────────────────────────────────────────────────── */
    #error-toast {
      display: none;
      position: fixed;
      bottom: 80px;
      left: 50%; transform: translateX(-50%);
      background: #c62828; color: #fff;
      font-size: 13px; font-weight: 500;
      padding: 10px 18px;
      border-radius: 20px;
      box-shadow: 0 4px 16px rgba(0,0,0,.3);
      z-index: 100;
      max-width: calc(100% - 32px);
      text-align: center;
      animation: fadeUp .2s ease;
    }

    /* ── Input bar ───────────────────────────────────────────────────── */
    #input-bar {
      background: var(--bg-input);
      padding: 10px 16px;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      flex-shrink: 0;
      border-top: 1px solid var(--border);
/* ── Input bar ───────────────────────────────────────────────────── */
#input-bar {
  background: var(--bg-input);
  padding: 10px 16px;
  display: flex;
  align-items: flex-end;
  gap: 10px;
  flex-shrink: 0;
  border-top: 1px solid var(--border);
}

/* Keyboard-open state — move input above the visible keyboard on mobile */
@media (max-width: 480px) {
  .keyboard-open #input-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 100;
    background: var(--bg-input);
    padding: 8px 10px;
    gap: 8px;
  }
  
  .keyboard-open #messages {
    padding-bottom: env(safe-area-inset-bottom);
  }
}
    }

    #message-input {
      flex: 1;
      background: #fff;
      border: none;
      border-radius: 22px;
      padding: 10px 16px;
      font-size: 14px;
      font-family: var(--font);
      resize: none;
      outline: none;
      max-height: 120px;
      overflow-y: auto;
      line-height: 1.4;
      box-shadow: var(--shadow);
      color: #111;
    }
    #message-input::placeholder { color: #aaa; }

    #btn-send {
      width: 44px; height: 44px;
      border-radius: 50%;
      background: var(--accent);
      border: none;
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background .15s, transform .1s;
      box-shadow: var(--shadow);
    }
    #btn-send:hover { background: var(--accent-hover); }
    #btn-send:active { transform: scale(.93); }
    #btn-send:disabled { background: #aaa; cursor: default; }

    /* ── Empty state ─────────────────────────────────────────────────── */
    #empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: var(--text-meta);
      font-size: 14px;
      padding: 24px;
      text-align: center;
    }
    #empty-state .icon { font-size: 48px; }
    #empty-state strong { color: #444; font-size: 15px; }

    .suggestions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 12px;
      width: 100%;
      max-width: 300px;
    }
    .suggestion-btn {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 8px 16px;
      font-size: 13px;
      color: var(--accent);
      cursor: pointer;
      text-align: left;
      transition: border-color .15s, background .15s;
    }
    .suggestion-btn:hover {
      border-color: var(--accent);
      background: #f0faf9;
    }

    /* ── Scrollbar ───────────────────────────────────────────────────── */
    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-thumb { background: #bbb; border-radius: 2px; }

    /* ── Full-height on small screens ────────────────────────────────── */
    @media (max-width: 640px) {
      html, body { background: var(--bg-app); }
      #app { max-width: 100vw; height: 100dvh; border-radius: 0; box-shadow: none; }
      #messages { padding: 12px; }
      .msg-row { max-width: 88%; }
      .product-grid { grid-template-columns: 1fr; }
      #input-bar { padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
      .bubble { font-size: 13px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }

    /* Focus indicators */
    button:focus-visible, input:focus-visible, textarea:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  </style>

<body>

<div id="app">

  <!-- ── Header ──────────────────────────────────────────────────── -->
  <header>
    <div class="avatar">🌸</div>
    <div class="header-info">
      <h1>MS Fragrances Assistant</h1>
      <p id="status-text">Online · AI Product Helper</p>
    </div>
    <button id="btn-new-chat" title="Start a new conversation">New Chat</button>
    <button id="btn-clear-chat" title="Clear current conversation" aria-label="Clear chat">Clear</button>
  </header>

  <!-- ── Config bar ──────────────────────────────────────────────── -->
  <div id="config-bar" style="display: none;">
    <label for="api-url-input">Backend:</label>
    <input id="api-url-input" type="text" value="http://localhost:8000" spellcheck="false" />
    <button id="btn-save-url">Save</button>
  </div>

  <!-- ── Message window ──────────────────────────────────────────── -->
  <div id="messages" role="log" aria-live="polite" aria-label="Chat messages">
    <!-- Empty state shown when no messages exist -->
    <div id="empty-state">
      <div class="icon">🧴</div>
      <strong>Ask about any product</strong>
      <p>I can check prices, sizes, stock & descriptions from our live inventory.</p>
      <div class="suggestions">
        <button class="suggestion-btn">Do you have Oud in 6ml?</button>
        <button class="suggestion-btn">Rose attar ka price kya hai?</button>
        <button class="suggestion-btn">Kya Musk Tahara available hai?</button>
        <button class="suggestion-btn">Tell me about Black Oud</button>
        <button class="suggestion-btn">Suggest a strong oud under 500</button>
        <button class="suggestion-btn">Daily wear attar</button>
      </div>
    </div>
  </div>

  <!-- ── Input bar ───────────────────────────────────────────────── -->
  <div id="input-bar">
    <textarea
      id="message-input"
      rows="1"
      placeholder="Type a message…"
      aria-label="Message input"
    ></textarea>
    <button id="btn-send" aria-label="Send message" disabled>
      &#10148;
    </button>
  </div>

</div>

<!-- Error toast -->
<div id="error-toast" role="alert"></div>

<script>
/* ================================================================
     State
   ================================================================ */
   let conversationHistory = [];   // updated_history from backend
   let isLoading = false;
   let isSending = false;
   let sendTimer = null;

   /* ================================================================
      DOM refs
   ================================================================ */
   const messagesEl   = document.getElementById('messages');
   const inputEl      = document.getElementById('message-input');
   const sendBtn      = document.getElementById('btn-send');
   const newChatBtn   = document.getElementById('btn-new-chat');
   const clearChatBtn = document.getElementById('btn-clear-chat');
   const errorToast   = document.getElementById('error-toast');
   const apiUrlInput  = document.getElementById('api-url-input');
   const saveUrlBtn   = document.getElementById('btn-save-url');
   const emptyState   = document.getElementById('empty-state');
   const statusText   = document.getElementById('status-text');

   /* ================================================================
      Persistence (sessionStorage) — MVP
   ================================================================ */
   const SESSION_KEY = 'msf_session';
   const SESSION_TTL = 30 * 60 * 1000; // 30 min idle expiry
   const MAX_RESTORED_HISTORY = 50;    // cap restored messages to avoid unbounded growth

   function saveSession() {
     try {
       sessionStorage.setItem(SESSION_KEY, JSON.stringify({
         history: conversationHistory,
         savedAt: Date.now(),
       }));
     } catch {}
   }

   function restoreSession() {
     try {
       const raw = sessionStorage.getItem(SESSION_KEY);
       if (!raw) return;
       const data = JSON.parse(raw);
       if (Date.now() - data.savedAt > SESSION_TTL) {
         sessionStorage.removeItem(SESSION_KEY);
         return;
       }
        conversationHistory = (data.history || []).slice(-MAX_RESTORED_HISTORY);
        if (conversationHistory.length) {
         emptyState.style.display = 'none';
         renderHistory();
       }
     } catch {}
   }

   function clearSession() {
     try { sessionStorage.removeItem(SESSION_KEY); } catch {}
   }

   function renderHistory() {
     messagesEl.innerHTML = '';
     conversationHistory.forEach(h => {
       if (h.role === 'user') {
         appendBubble('sent', h.content);
       } else if (h.role === 'assistant') {
         appendBubble('recv', h.content, h.tool_calls_made, h.tool_results);
       }
     });
   }

  /* ================================================================
     Config — backend URL
  ================================================================ */
   const STORAGE_KEY_URL = 'msf_backend_url';
   const DEFAULT_BACKEND_URL = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
     ? 'http://localhost:8000'
     : 'https://attar-ai-automatic-agent-1.onrender.com';
   apiUrlInput.value = localStorage.getItem(STORAGE_KEY_URL) || DEFAULT_BACKEND_URL;

  function getBaseUrl() {
    return apiUrlInput.value.replace(/\/$/, '');
  }

  saveUrlBtn.addEventListener('click', () => {
    localStorage.setItem(STORAGE_KEY_URL, apiUrlInput.value.trim());
    showToast('Backend URL saved ✓', '#128c7e');
  });

  /* ================================================================
     Auto-resize textarea
  ================================================================ */
  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
    sendBtn.disabled = inputEl.value.trim() === '' || isLoading;
  });

  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      if (!sendBtn.disabled) sendMessage();
    }
/* ================================================================
      Keyboard-aware chat input for mobile
   ================================================================ */
  function isMobile() {
    return window.innerWidth < 768 ||
      /Mobi|Android|iPhone|iPad/.test(navigator.userAgent);
  }

  inputEl.addEventListener('focus', () => {
    if (isMobile()) {
      document.body.classList.add('keyboard-open');
    }
  });

  inputEl.addEventListener('blur', () => {
    if (isMobile()) {
      document.body.classList.remove('keyboard-open');
    }
  });
  });

  /* ================================================================
     Suggestion chips
  ================================================================ */
  document.querySelectorAll('.suggestion-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      inputEl.value = btn.textContent;
      inputEl.dispatchEvent(new Event('input'));
      sendMessage();
    });
  });

/* ================================================================
      New Chat / Clear Chat
   ================================================================ */
   function resetChat() {
     if (isLoading || isSending) return;
     conversationHistory = [];
     clearSession();
     messagesEl.innerHTML = '';
     messagesEl.appendChild(emptyState);
     emptyState.style.display = 'flex';
     inputEl.value = '';
     inputEl.style.height = 'auto';
     sendBtn.disabled = true;
   }

   newChatBtn.addEventListener('click', resetChat);
   clearChatBtn.addEventListener('click', resetChat);

   /* ================================================================
      Send button
   ================================================================ */
   sendBtn.addEventListener('click', sendMessage);

   /* ================================================================
      Core: send a message
   ================================================================ */
   async function sendMessage() {
     const text = inputEl.value.trim();
     if (!text || isLoading || isSending) return;

     isSending = true;
     sendBtn.disabled = true;

     // Hide empty state
     emptyState.style.display = 'none';

     // Append user bubble
     appendBubble('sent', text);

     // Clear input
     inputEl.value = '';
     inputEl.style.height = 'auto';
     setLoading(true);

     // Show typing indicator
     const typingEl = appendTyping();

     try {
       const response = await fetch(`${getBaseUrl()}/chat`, {
         method: 'POST',
         headers: { 'Content-Type': 'application/json' },
         body: JSON.stringify({
           message: text,
           history: conversationHistory,
         }),
       });

       if (!response.ok) {
         let detail = `HTTP ${response.status}`;
         try { const err = await response.json(); detail = err.detail || detail; } catch {}
         throw new Error(detail);
       }

       const data = await response.json();

       // Save updated history for the next call
       conversationHistory = data.updated_history || [];
       saveSession();

       // Remove typing indicator and show reply
       typingEl.remove();
       appendBubble('recv', data.reply, data.tool_calls_made, data.tool_results);

     } catch (err) {
       typingEl.remove();
       const friendly = friendlyError(err);
       showToast('⚠ ' + friendly);
       appendErrorBubble(friendly);
     } finally {
       setLoading(false);
       isSending = false;
       sendBtn.disabled = inputEl.value.trim() === '';
     }
   }

   function friendlyError(err) {
     const msg = err.message || String(err);
     if (msg.includes('Failed to fetch')) {
       return 'Cannot reach the backend. Is the server running?';
     }
     if (msg.includes('timeout') || msg.includes('timed out')) {
       return 'The request took too long. Please try again.';
     }
     if (/40[0-9]/.test(msg) || /50[0-9]/.test(msg)) {
       return 'The server returned an error. Please try again later.';
     }
     if (msg.toLowerCase().includes('no recommendations') || msg.toLowerCase().includes('not found')) {
       return 'No matching products found. Try a different name or size.';
     }
     if (msg.toLowerCase().includes('inventory') || msg.toLowerCase().includes('out of stock') || msg.toLowerCase().includes('unavailable')) {
       return 'That item is currently unavailable. Try another product.';
     }
     return 'Something went wrong. Please try again.';
   }

  /* ================================================================
     UI helpers
  ================================================================ */
  function setLoading(state) {
    isLoading = state;
    sendBtn.disabled = state || inputEl.value.trim() === '';
    statusText.textContent = state ? 'Thinking…' : 'Online · AI Product Helper';
  }

  function formatTime() {
    return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  /* Append a sent or received bubble */
  function appendBubble(side, text, toolCallsMade, toolResults) {
    const row = document.createElement('div');
    row.className = `msg-row ${side}`;

    const bubble = document.createElement('div');
    bubble.className = 'bubble';

    // Render text with line-break support
    bubble.appendChild(renderText(text));

    const meta = document.createElement('span');
    meta.className = 'meta';
    meta.textContent = formatTime() + (side === 'recv' ? ' · AI' : '');
    bubble.appendChild(meta);

    row.appendChild(bubble);

    // Render recommendation cards inline when the agent used recommend_products
    if (side === 'recv' && toolResults) {
      const recToolResult = toolResults.find(tr => tr && tr.result && Array.isArray(tr.result.products));
      if (recToolResult) {
        const grid = buildRecommendationGrid(recToolResult.result);
        if (grid) row.appendChild(grid);
      }
    }

    // Lookup details panel (only for AI replies that used a tool)
    if (side === 'recv' && toolCallsMade && toolCallsMade.length > 0) {
      const detailsWrap = document.createElement('div');
      detailsWrap.className = 'details-wrap';
      detailsWrap.appendChild(buildDetailsPanel(toolCallsMade, toolResults));
      row.appendChild(detailsWrap);
    }

    messagesEl.appendChild(row);
    scrollToBottom();
    return row;
  }

  /* Error bubble (recv style, red text) */
  function appendErrorBubble(msg) {
    const row = document.createElement('div');
    row.className = 'msg-row recv';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.style.cssText = 'background:#fff1f0; border:1px solid #ffccc7;';
    bubble.innerHTML = `<span style="color:#c62828">⚠ ${escHtml(msg)}</span>`;
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    scrollToBottom();
  }

  /* Typing indicator */
  function appendTyping() {
    const row = document.createElement('div');
    row.className = 'msg-row recv typing-row';
    row.innerHTML = `
      <div class="typing">
        <span></span><span></span><span></span>
      </div>`;
    messagesEl.appendChild(row);
    scrollToBottom();
    return row;
  }

  /* ================================================================
     Inventory details panel builder
  ================================================================ */
  function buildDetailsPanel(toolCallsMade, toolResults) {
    const det = document.createElement('details');

    const sum = document.createElement('summary');
    sum.textContent = `Inventory Lookup Details (${toolCallsMade.length} call${toolCallsMade.length > 1 ? 's' : ''})`;
    det.appendChild(sum);

    const body = document.createElement('div');
    body.className = 'details-body';

    /* --- Tool calls section --- */
    const callsSection = document.createElement('div');
    callsSection.className = 'details-section';
    const callsH = document.createElement('h4');
    callsH.textContent = 'Lookups Requested';
    callsSection.appendChild(callsH);

    toolCallsMade.forEach(tc => {
      const pill = document.createElement('div');
      pill.className = 'tool-call';
      const args = tc.arguments || {};
      const argStr = Object.entries(args)
        .map(([k, v]) => `${k}: <span>"${escHtml(String(v))}"</span>`)
        .join('  ');
      pill.innerHTML = `🔍 ${escHtml(tc.tool)}( ${argStr} )`;
      callsSection.appendChild(pill);
    });

    body.appendChild(callsSection);

    /* --- Tool results section --- */
    const resultsSection = document.createElement('div');
    resultsSection.className = 'details-section';
    const resultsH = document.createElement('h4');
    resultsH.textContent = 'Inventory Data Returned';
    resultsSection.appendChild(resultsH);

    (toolResults || []).forEach(tr => {
      const result = tr.result;

      if (!result || (Array.isArray(result) && result.length === 0)) {
        const none = document.createElement('div');
        none.className = 'no-results';
        none.textContent = 'No matching products found in inventory.';
        resultsSection.appendChild(none);
        return;
      }

      // Recommendation result — render as cards
      if (result && Array.isArray(result.products)) {
        if (result.products.length === 0) {
          const none = document.createElement('div');
          none.className = 'no-results';
          none.textContent = 'No suitable products found for the given preferences.';
          resultsSection.appendChild(none);
          return;
        }
        const grid = buildRecommendationGrid(result);
        if (grid) resultsSection.appendChild(grid);
        return;
      }

      // Array of product rows
      if (Array.isArray(result)) {
        result.forEach(row => resultsSection.appendChild(buildProductCard(row)));
        return;
      }

      // Error or unexpected shape — show raw JSON
      const raw = document.createElement('pre');
      raw.className = 'raw-json';
      raw.textContent = JSON.stringify(result, null, 2);
      resultsSection.appendChild(raw);
    });

    body.appendChild(resultsSection);
    det.appendChild(body);
    return det;
  }

  /* Product card for one inventory row */
  function buildProductCard(row) {
    const card = document.createElement('div');
    card.className = 'product-card';

    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = row.product_name || '—';
    card.appendChild(name);

    if (row.size || row.price_inr !== undefined) {
      const size = document.createElement('div');
      size.className = 'size';
      size.textContent = row.size ? `Size: ${row.size}` : '';
      card.appendChild(size);

      const price = document.createElement('div');
      price.className = 'price';
      price.textContent = row.price_inr !== undefined ? `₹${row.price_inr}` : '';
      card.appendChild(price);
    }

    if (row.in_stock !== undefined && row.in_stock !== null) {
      const emptyCell = document.createElement('div');
      card.appendChild(emptyCell);

      const stock = document.createElement('div');
      const inStock = row.in_stock === true || row.in_stock === 'true' || row.in_stock === 1;
      stock.className = inStock ? 'stock-yes' : 'stock-no';
      stock.textContent = inStock ? '✓ In Stock' : '✗ Out of Stock';
      card.appendChild(stock);
    }

    if (row.description) {
      const desc = document.createElement('div');
      desc.className = 'desc';
      desc.textContent = row.description;
      card.appendChild(desc);
    }

    return card;
  }

  /* ================================================================
     Recommendation cards grid
  ================================================================ */
  function buildRecommendationGrid(result) {
    const products = (result && Array.isArray(result.products)) ? result.products : [];
    if (products.length === 0) return null;

    const grid = document.createElement('div');
    grid.className = 'product-grid';

    products.forEach(p => {
      const card = document.createElement('div');
      card.className = 'product-card';

      // Image placeholder
      const img = document.createElement('div');
      img.className = 'img-placeholder';
      img.textContent = '🧴';
      card.appendChild(img);

      const name = document.createElement('div');
      name.className = 'name';
      name.textContent = p.product_name || '—';
      card.appendChild(name);

      const price = document.createElement('div');
      price.className = 'price';
      const priceVal = (p.price !== null && p.price !== undefined) ? `₹${p.price}` : '';
      price.textContent = priceVal;
      card.appendChild(price);

      if (p.size) {
        const size = document.createElement('div');
        size.className = 'size';
        size.textContent = `Size: ${p.size}`;
        card.appendChild(size);
      }

      // Verification badge
      const status = (p.verification_status || (p.verification && p.verification.status) || '').toLowerCase();
      let badgeClass = 'unverified';
      let badgeText = 'Unverified';
      if (status === 'verified') { badgeClass = 'verified'; badgeText = 'Verified'; }
      else if (status === 'out_of_stock') { badgeClass = 'out-of-stock'; badgeText = 'Out of stock'; }
      else if (status === 'not_found') { badgeClass = 'not-found'; badgeText = 'Not found'; }
      else if (status === 'price_changed') { badgeClass = 'unverified'; badgeText = 'Price updated'; }
      else if (status === 'ambiguous_match') { badgeClass = 'not-found'; badgeText = 'Ambiguous'; }
      else if (status === 'verification_failed') { badgeClass = 'not-found'; badgeText = 'Unverified'; }
      const badge = document.createElement('span');
      badge.className = `badge ${badgeClass}`;
      badge.textContent = badgeText;
      card.appendChild(badge);

      if (p.reason) {
        const reason = document.createElement('div');
        reason.className = 'reason';
        reason.textContent = p.reason;
        card.appendChild(reason);
      }

      if (p.matched_attributes && p.matched_attributes.length) {
        const attrs = document.createElement('div');
        attrs.className = 'size';
        attrs.textContent = `Matches: ${p.matched_attributes.join(', ')}`;
        card.appendChild(attrs);
      }

      const actions = document.createElement('div');
      actions.className = 'actions';
      const askBtn = document.createElement('button');
      askBtn.textContent = 'Ask about this attar';
      askBtn.addEventListener('click', () => {
        inputEl.value = `Tell me more about ${p.product_name}`;
        inputEl.dispatchEvent(new Event('input'));
        sendMessage();
      });
      actions.appendChild(askBtn);
      card.appendChild(actions);

      grid.appendChild(card);
    });

    return grid;
  }

  /* ================================================================
     Utilities
  ================================================================ */
  function renderText(text) {
    // Preserve newlines in AI replies
    const frag = document.createDocumentFragment();
    text.split('\n').forEach((line, i, arr) => {
      frag.appendChild(document.createTextNode(line));
      if (i < arr.length - 1) frag.appendChild(document.createElement('br'));
    });
    return frag;
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  /* ================================================================
     Image URL allowlist — untrusted product image URLs must be HTTPS
     and hosted on a trusted domain. Returns a safe URL or null.
     Product images are placeholders today, but any future image
     rendering must pass through this helper.
  ================================================================ */
  const TRUSTED_IMAGE_HOSTS = new Set([
    'localhost',
    '127.0.0.1',
    'msfragrances.com',
    'www.msfragrances.com',
  ]);

  function safeImageUrl(rawUrl) {
    if (!rawUrl || typeof rawUrl !== 'string') return null;
    let parsed;
    try {
      parsed = new URL(rawUrl, window.location.origin);
    } catch {
      return null;
    }
    if (parsed.protocol !== 'https:') return null;
    if (!TRUSTED_IMAGE_HOSTS.has(parsed.hostname)) return null;
    return parsed.href;
  }

  function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  let toastTimer;
  function showToast(msg, bg = '#c62828') {
    errorToast.textContent = msg;
    errorToast.style.background = bg;
    errorToast.style.display = 'block';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { errorToast.style.display = 'none'; }, 4000);
  }

  // Restore persisted session (if any) on load
  restoreSession();
</script>
</body>
</html>
